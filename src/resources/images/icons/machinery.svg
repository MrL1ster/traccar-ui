<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="machineryShadow" x="6" y="3" width="52" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#machineryShadow)">
    <!-- Heavy Left & Right Caterpillar Tracks -->
    <rect x="12" y="22" width="7.5" height="32" rx="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="44.5" y="22" width="7.5" height="32" rx="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Track Treads -->
    <path d="M12.5 26H19M12.5 31H19M12.5 36H19M12.5 41H19M12.5 46H19M12.5 50H19" stroke="#475569" stroke-width="1.4"/>
    <path d="M45 26H51.5M45 31H51.5M45 36H51.5M45 41H51.5M45 46H51.5M45 50H51.5" stroke="#475569" stroke-width="1.4"/>
    <!-- Main Excavator / Machinery Body -->
    <rect x="18" y="25" width="28" height="27" rx="4" fill="#f59e0b" stroke="#78350f" stroke-width="1.6"/>
    <!-- Rear Engine Hood & Counterweight -->
    <rect x="20" y="44" width="24" height="6.5" rx="2" fill="#d97706" stroke="#78350f" stroke-width="1"/>
    <line x1="23" y1="46.5" x2="41" y2="46.5" stroke="#78350f" stroke-width="1.2"/>
    <line x1="23" y1="48.5" x2="41" y2="48.5" stroke="#78350f" stroke-width="1.2"/>
    <!-- Operator Cab (Left Side) -->
    <rect x="19.5" y="27" width="11.5" height="15" rx="2" fill="#1e293b" stroke="#f8fafc" stroke-width="1"/>
    <rect x="21" y="28.5" width="8.5" height="5.5" rx="1" fill="#38bdf8" fill-opacity="0.85"/>
    <!-- Front Digging Boom & Bucket (Pointing North) -->
    <rect x="31" y="13" width="6.5" height="23" rx="2" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <rect x="32.8" y="16" width="3" height="10" rx="1" fill="#475569"/>
    <!-- Excavator Bucket with Teeth -->
    <path d="M26 7.5H42.5L40.5 14H28L26 7.5Z" fill="#334155" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M28 7.5V5.2M32 7.5V5.2M36.5 7.5V5.2M40.5 7.5V5.2" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
  </g>
