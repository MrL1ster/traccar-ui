<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="trailerShadow" x="8" y="4" width="48" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="trailerBed" x1="18" y1="20" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <g filter="url(#trailerShadow)">
    <!-- A-Frame Drawbar & Tow Hitch at Front (North) -->
    <path d="M32 8L23 21H41L32 8Z" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
    <line x1="32" y1="8" x2="32" y2="21" stroke="#475569" stroke-width="2"/>
    <!-- Hitch Coupler Ball Socket & Jockey Wheel -->
    <circle cx="32" cy="7.5" r="3" fill="#f59e0b" stroke="#1e293b" stroke-width="1.3"/>
    <circle cx="29" cy="15" r="1.8" fill="#1e293b"/>
    <!-- Tandem Axle Tires & Wheel Guards -->
    <rect x="13.5" y="29" width="4.5" height="8.5" rx="1.8" fill="#1e293b"/>
    <rect x="13.5" y="39" width="4.5" height="8.5" rx="1.8" fill="#1e293b"/>
    <rect x="46" y="29" width="4.5" height="8.5" rx="1.8" fill="#1e293b"/>
    <rect x="46" y="39" width="4.5" height="8.5" rx="1.8" fill="#1e293b"/>
    <rect x="16" y="27.5" width="3" height="21.5" rx="1" fill="#64748b"/>
    <rect x="45" y="27.5" width="3" height="21.5" rx="1" fill="#64748b"/>
    <!-- Trailer Box Bed -->
    <rect x="18" y="20" width="28" height="35" rx="2.5" fill="url(#trailerBed)" stroke="#334155" stroke-width="1.8"/>
    <!-- Inner Cargo Floor & Tie-Down Ribs -->
    <rect x="20.5" y="22.5" width="23" height="30" rx="1.5" fill="#475569"/>
    <line x1="21" y1="27.5" x2="43" y2="27.5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="21" y1="32.5" x2="43" y2="32.5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="21" y1="37.5" x2="43" y2="37.5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="21" y1="42.5" x2="43" y2="42.5" stroke="#64748b" stroke-width="1.4"/>
    <line x1="21" y1="47.5" x2="43" y2="47.5" stroke="#64748b" stroke-width="1.4"/>
    <!-- Rear Tailgate & LED Taillights -->
    <rect x="19.5" y="53.5" width="6" height="2" rx="0.8" fill="#ef4444"/>
    <rect x="38.5" y="53.5" width="6" height="2" rx="0.8" fill="#ef4444"/>
  </g>
