<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="uteShadow" x="8" y="3" width="48" height="59" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="uteCab" x1="18" y1="8" x2="46" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="uteCanopy" x1="18" y1="34" x2="46" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <g filter="url(#uteShadow)">
    <!-- Front Bullbar -->
    <path d="M21 7.5C25 6.3 39 6.3 43 7.5" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Heavy Duty Tires -->
    <rect x="14.5" y="14" width="4" height="9.5" rx="2" fill="#1e293b"/>
    <rect x="45.5" y="14" width="4" height="9.5" rx="2" fill="#1e293b"/>
    <rect x="14.5" y="42" width="4" height="9.5" rx="2" fill="#1e293b"/>
    <rect x="45.5" y="42" width="4" height="9.5" rx="2" fill="#1e293b"/>
    <!-- Ute Cab Body -->
    <path d="M21 9.5C24.5 7.8 39.5 7.8 43 9.5C45.8 11.5 46.5 15 46.5 21V34.5H17.5V21C17.5 15 18.2 11.5 21 9.5Z" fill="url(#uteCab)" stroke="#475569" stroke-width="1.4"/>
    <!-- Side Mirrors -->
    <path d="M17.5 21.5L13 23C12.5 23.4 12.6 24.8 13.6 25L17.5 24.5Z" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <path d="M46.5 21.5L51 23C51.5 23.4 51.4 24.8 50.4 25L46.5 24.5Z" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
    <!-- Bonnet Ridges -->
    <path d="M23.5 10.5L24.5 18.5M40.5 10.5L39.5 18.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Front Windscreen -->
    <path d="M20.5 20.5C24.5 18.8 39.5 18.8 43.5 20.5L41.5 26.8C38 26 26 26 22.5 26.8L20.5 20.5Z" fill="#1e293b"/>
    <!-- Dual Cab Roof -->
    <rect x="21.5" y="26.8" width="21" height="7.2" rx="1.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Tradie Service Canopy with Ribbed Roof & Ladder Racks -->
    <rect x="17" y="34.5" width="30" height="22" rx="2.5" fill="url(#uteCanopy)" stroke="#334155" stroke-width="1.5"/>
    <!-- Canopy Tool Doors Highlight -->
    <line x1="19" y1="36.5" x2="19" y2="54.5" stroke="#f8fafc" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="45" y1="36.5" x2="45" y2="54.5" stroke="#f8fafc" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- Roof Racks / Tradie Bars -->
    <rect x="16" y="38.5" width="32" height="2.4" rx="1" fill="#1e293b"/>
    <rect x="16" y="50.5" width="32" height="2.4" rx="1" fill="#1e293b"/>
    <!-- Ladder / Conduit Pipe on Canopy Roof -->
    <rect x="22" y="36.5" width="5" height="18" rx="1" fill="#f59e0b" stroke="#b45309" stroke-width="0.9"/>
    <line x1="22" y1="40" x2="27" y2="40" stroke="#b45309" stroke-width="0.9"/>
    <line x1="22" y1="45" x2="27" y2="45" stroke="#b45309" stroke-width="0.9"/>
    <line x1="22" y1="50" x2="27" y2="50" stroke="#b45309" stroke-width="0.9"/>
    <rect x="37" y="36.5" width="3.2" height="18" rx="1.5" fill="#e2e8f0" stroke="#64748b" stroke-width="0.9"/>
    <!-- Headlights & Taillights -->
    <rect x="19.5" y="9.2" width="5" height="2" rx="1" fill="#fef08a"/>
    <rect x="39.5" y="9.2" width="5" height="2" rx="1" fill="#fef08a"/>
    <rect x="19" y="55.2" width="6" height="1.8" rx="0.9" fill="#ef4444"/>
    <rect x="39" y="55.2" width="6" height="1.8" rx="0.9" fill="#ef4444"/>
